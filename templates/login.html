<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>تسجيل الدخول</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <style>
    body { background: #0b1220; }
    .card { border: 0; border-radius: 16px; }
  </style>
</head>
<body>
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h4 class="mb-1">تسجيل الدخول</h4>
            <div class="text-secondary mb-3">ادخل رقم الموظف و الـ PIN</div>

            {% if error %}
              <div class="alert alert-danger py-2">{{ error }}</div>
            {% endif %}

            <form method="post" action="/login">
              <div class="mb-3">
                <label class="form-label">رقم الموظف</label>
                <input name="employee_code" class="form-control" placeholder="مثال: 77943" required />
              </div>
              <div class="mb-3">
                <label class="form-label">PIN</label>
                <input name="pin" class="form-control" type="password" placeholder="••••" required />
              </div>
              <button class="btn btn-primary w-100">دخول</button>
            </form>

            <hr class="my-4" />
            <div class="small text-secondary">
              ملاحظة: كل موظف يشوف سجلاته فقط.
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
