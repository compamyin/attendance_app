<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>إضافة موظف</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4">
    <a href="/admin/logout" class="btn btn-outline-secondary btn-sm">خروج Admin</a>
    <h3 class="mt-3">إضافة موظف</h3>
    {% if error %}<div class="alert alert-danger">{{error}}</div>{% endif %}
    {% if success %}<div class="alert alert-success">{{success}}</div>{% endif %}
    <form method="post">
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Employee ID</label>
          <input class="form-control" name="employee_code" required>
        </div>
        <div class="col-md-8">
          <label class="form-label">اسم الموظف</label>
          <input class="form-control" name="full_name" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">الرقم الوطني</label>
          <input class="form-control" name="national_id">
        </div>
        <div class="col-md-4">
          <label class="form-label">الهاتف</label>
          <input class="form-control" name="phone">
        </div>
        <div class="col-md-4">
          <label class="form-label">IP المسموح</label>
          <input class="form-control" name="allowed_ip" placeholder="مثال: 192.168.1.10">
          <div class="text-muted" style="font-size:12px;">إذا تركته فاضي = بدون تقييد.</div>
        </div>

        <div class="col-md-4">
          <label class="form-label">الراتب الشهري</label>
          <input class="form-control" name="salary_monthly" type="number" step="0.01">
        </div>
<div class="col-md-4">
          <label class="form-label">PIN (كلمة دخول الموظف)</label>
          <input class="form-control" type="password" name="pin" required>
        </div>
      </div>
      <button class="btn btn-primary mt-3">إضافة</button>
    </form>
  </div>
</body>
</html>
