<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>إنشاء مستخدم</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4">
    <a href="/admin/logout" class="btn btn-outline-secondary btn-sm">خروج Admin</a>
    <h3 class="mt-3">إنشاء مستخدم (HR / MANAGER / ADMIN)</h3>
    {% if error %}<div class="alert alert-danger">{{error}}</div>{% endif %}
    {% if success %}<div class="alert alert-success">{{success}}</div>{% endif %}
    <form method="post">
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Username</label>
          <input class="form-control" name="username" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Password</label>
          <input class="form-control" type="password" name="password" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">PIN</label>
          <input class="form-control" type="password" name="pin" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Role</label>
          <select class="form-select" name="role" required>
            <option>HR</option>
            <option>MANAGER</option>
            <option>ADMIN</option>
          </select>
        </div>
      </div>
      <button class="btn btn-primary mt-3">إنشاء</button>
    </form>
  </div>
</body>
</html>
