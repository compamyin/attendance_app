<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>تغيير PIN</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <div class="container py-4">
    <a href="/dashboard" class="btn btn-outline-secondary btn-sm">رجوع</a>
    <h3 class="mt-3">تغيير PIN</h3>
    {% if error %}<div class="alert alert-danger">{{error}}</div>{% endif %}
    {% if success %}<div class="alert alert-success">{{success}}</div>{% endif %}
    <form method="post">
      <div class="mb-3">
        <label class="form-label">PIN القديم</label>
        <input class="form-control" type="password" name="old_pin" required>
      </div>
      <div class="mb-3">
        <label class="form-label">PIN الجديد</label>
        <input class="form-control" type="password" name="new_pin" required>
      </div>
      <button class="btn btn-primary">حفظ</button>
    </form>
  </div>
</body>
</html>
